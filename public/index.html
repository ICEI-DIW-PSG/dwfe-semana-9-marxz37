<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Ecommerce</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Mini Ecommerce</h1>
    
    <div id="controls">
        <input type="text" id="search" placeholder="Buscar produto por nome...">
        <select id="category">
            <option value="Todas">Todas</option>
            </select>
        <button id="btnRender">Renderizar</button>
    </div>

    <div id="product-details">
        <p>Clique em "Ver detalhes" em um produto para exibir as informações aqui.</p>
    </div>

    <div id="product-list">
        </div>

    <script src="script.js"></script>
</body>
</html>
